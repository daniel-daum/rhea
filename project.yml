name: Rhea
options:
  bundleIdPrefix: net.danieldaum
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Rhea:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Rhea
    settings:
      base:
        PRODUCT_NAME: Rhea
        PRODUCT_BUNDLE_IDENTIFIER: net.danieldaum.rhea
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc "sign to run locally" so it builds without an Apple team.
        # For distribution, set your Developer ID + DEVELOPMENT_TEAM and notarize.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_KEY_CFBundleDisplayName: Rhea
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Daniel Daum"
