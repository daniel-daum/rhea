name: Rhea
options:
  bundleIdPrefix: net.danieldaum
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Rhea:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Rhea
    settings:
      base:
        PRODUCT_NAME: Rhea
        PRODUCT_BUNDLE_IDENTIFIER: net.danieldaum.rhea
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        INFOPLIST_KEY_CFBundleDisplayName: Rhea
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Daniel Daum"
      configs:
        Debug:
          # Ad-hoc "sign to run locally" so local/CI builds work without a team.
          CODE_SIGN_IDENTITY: "-"
        Release:
          # Real Developer ID signing for distributable (notarized) builds; see
          # .gitea/workflows/release.yml, which imports the cert into a temporary
          # runner keychain before invoking a Release build.
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: V4A23659NX
  RheaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/RheaTests
      - path: Tests/Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.danieldaum.rhea.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - target: Rhea
  RheaUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/RheaUITests
      - path: Tests/Fixtures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.danieldaum.rhea.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Xcode's generated XCTRunner host app is sandboxed with network.client only;
        # the in-process StubExtractionServer needs network.server to listen on loopback.
        CODE_SIGN_ENTITLEMENTS: Tests/RheaUITests/RheaUITests.entitlements
    dependencies:
      - target: Rhea
schemes:
  Rhea:
    build:
      targets:
        Rhea: all
        RheaTests: [test]
        RheaUITests: [test]
    test:
      targets:
        - RheaTests
        - RheaUITests
