name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "marketing_version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate into temporary keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/developer_id.p12"

          echo -n "$MACOS_CERTIFICATE_P12" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          rm -f "$CERT_PATH"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build Release
        run: |
          # Notarization requirements a plain (non-archive) xcodebuild doesn't meet
          # by default: sign with a secure timestamp (Xcode passes --timestamp=none
          # outside of Archive) and don't inject the get-task-allow debug
          # entitlement (CODE_SIGN_INJECT_BASE_ENTITLEMENTS). Apple rejects the
          # submission as Invalid on both counts otherwise.
          xcodebuild clean build \
            -project Rhea.xcodeproj \
            -scheme Rhea \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--keychain $keychain_path --timestamp"

      - name: Verify code signature
        run: |
          APP_PATH="build/Build/Products/Release/Rhea.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH"

      - name: Package into dmg
        run: |
          APP_PATH="build/Build/Products/Release/Rhea.app"
          DMG_NAME="Rhea-${{ steps.version.outputs.tag }}.dmg"
          STAGING_DIR="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING_DIR"
          cp -R "$APP_PATH" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "Rhea" -srcfolder "$STAGING_DIR" -ov -format UDZO "$DMG_NAME"
          # Gatekeeper assesses the disk image's own signature, not just the app
          # inside it — an unsigned dmg is rejected with "no usable signature"
          # even when its contents are signed and notarized.
          codesign --sign "Developer ID Application" --timestamp \
            --keychain "$keychain_path" "$DMG_NAME"
          echo "dmg_path=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Notarize dmg
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo -n "$APPLE_API_KEY_P8" | base64 --decode -o "$KEY_PATH"

          # notarytool exits 0 whenever processing completes, even when the verdict
          # is Invalid — parse the status and fetch the rejection log ourselves.
          SUBMIT_JSON=$(xcrun notarytool submit "$dmg_path" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait --output-format json)
          echo "$SUBMIT_JSON"
          STATUS=$(echo "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          SUBMISSION_ID=$(echo "$SUBMIT_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization verdict: $STATUS — fetching log:"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID"
            rm -f "$KEY_PATH"
            exit 1
          fi

          rm -f "$KEY_PATH"

      - name: Staple notarization ticket
        run: |
          # notarytool --wait reports success as soon as Apple's notary service
          # finishes, but the ticket can take a little longer to propagate through
          # Apple's CloudKit-backed distribution — stapling immediately after can
          # transiently fail with "CloudKit query ... Record not found". Retry with
          # backoff rather than failing the whole release on a race condition.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$dmg_path"; then
              exit 0
            fi
            echo "staple attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          echo "stapling failed after all retries"
          exit 1

      - name: Verify Gatekeeper acceptance
        run: |
          spctl -a -t open --context context:primary-signature -v "$dmg_path"
          spctl -a -vv "build/Build/Products/Release/Rhea.app"

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [ -n "$keychain_path" ] && [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path" || true
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          NOTES=$(python3 Packaging/scripts/extract_changelog.py \
            "${{ steps.version.outputs.marketing_version }}" CHANGELOG.md)
          {
            echo "log<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Gitea release
        id: create_release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent re-runs: a re-pushed tag (e.g. after a failed run) may
          # already have a release — delete it so the create below starts clean.
          EXISTING_ID=$(curl -s \
            -H "Authorization: token $GITEA_TOKEN" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          if [ -n "$EXISTING_ID" ]; then
            echo "deleting existing release $EXISTING_ID for tag ${{ steps.version.outputs.tag }}"
            curl -s -X DELETE \
              -H "Authorization: token $GITEA_TOKEN" \
              "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/$EXISTING_ID"
          fi

          BODY=$(python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))" <<< "${{ steps.changelog.outputs.log }}")
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${{ steps.version.outputs.tag }}\",\"name\":\"${{ steps.version.outputs.tag }}\",\"body\":$BODY,\"draft\":false,\"prerelease\":false}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases")
          echo "$RESPONSE"
          echo "release_id=$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')" >> "$GITHUB_OUTPUT"

      - name: Upload dmg to release
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@${dmg_path}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.release_id }}/assets?name=${dmg_path}"

      - name: Fetch Sparkle release tools
        run: |
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz" -o sparkle.tar.xz
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools bin/sign_update
          chmod +x sparkle-tools/bin/sign_update

      - name: Sign and publish appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOWNLOAD_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${dmg_path}"
          # sign_update opens its key file with Foundation APIs that can't read
          # bash process-substitution fd paths (/dev/fd/N) — use a real temp file.
          # Its output is already formatted as enclosure attributes:
          #   sparkle:edSignature="..." length="..."
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          SIGNATURE_ATTRS=$(sparkle-tools/bin/sign_update "$dmg_path" -f "$SPARKLE_KEY_FILE")
          rm -f "$SPARKLE_KEY_FILE"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

          # NOTE: this release-side appcast only lists the current release. Sparkle isn't
          # wired into the app yet (see ticket #45 scope decision), so there's no in-app
          # consumer of update history to preserve; a follow-up ticket that adds Sparkle to
          # the app should also decide how far back the feed needs to accumulate.
          cat > appcast.xml <<XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Rhea</title>
              <item>
                <title>${{ steps.version.outputs.tag }}</title>
                <pubDate>$PUB_DATE</pubDate>
                <sparkle:version>${{ steps.version.outputs.marketing_version }}</sparkle:version>
                <sparkle:shortVersionString>${{ steps.version.outputs.marketing_version }}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="$DOWNLOAD_URL"
                  type="application/octet-stream"
                  $SIGNATURE_ATTRS />
              </item>
            </channel>
          </rss>
          XMLEOF

          curl -s -X POST \
            -H "Authorization: token $GITEA_TOKEN" \
            -F "attachment=@appcast.xml" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.release_id }}/assets?name=appcast.xml"
